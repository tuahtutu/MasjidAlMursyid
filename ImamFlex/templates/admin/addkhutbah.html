{% load static %}

<!DOCTYPE html>
<html lang="ms">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tambah Khutbah Jumaat - ImamFlex</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Scheherazade&family=Poppins:wght@300;500;700&display=swap"
        rel="stylesheet"
    >

    <script
        src="https://kit.fontawesome.com/a2d9b6cfcb.js"
        crossorigin="anonymous">
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;

            background:
                linear-gradient(
                    to right,
                    #0d1b2a,
                    #1b263b
                );

            font-family: 'Poppins', sans-serif;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-container {

            width: 100%;
            max-width: 650px;

            background-color:
                rgba(255, 255, 255, 0.05);

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 0 20px rgba(255, 215, 0, 0.25);

            border: 1px solid rgba(255, 215, 0, 0.25);
        }

        h2 {

            color: gold;

            margin-top: 0;
            margin-bottom: 30px;

            text-align: center;

            font-size: 1.7rem;
        }

        .form-group {

            margin-bottom: 20px;
        }

        .form-group label {

            display: block;

            font-weight: 600;

            margin-bottom: 8px;

            color: gold;
        }

        .form-group input,
        .form-group select {

            width: 100%;

            padding: 12px 14px;

            border-radius: 6px;

            border: none;

            font-family: 'Poppins', sans-serif;

            font-size: 0.95rem;

            background: white;

            color: #0d1b2a;
        }

        .form-group input:focus,
        .form-group select:focus {

            outline: 2px solid gold;
        }

        /* PDF upload */

        .pdf-upload {

            border: 2px dashed rgba(255, 215, 0, 0.5);

            border-radius: 8px;

            padding: 20px;

            background: rgba(255, 255, 255, 0.03);

            text-align: center;
        }

        .pdf-upload i {

            font-size: 35px;

            color: gold;

            margin-bottom: 10px;
        }

        .pdf-upload input {

            background: transparent;

            color: white;

            padding: 10px;

            cursor: pointer;
        }

        .pdf-info {

            display: block;

            margin-top: 8px;

            color: #ccc;

            font-size: 0.8rem;
        }

        .btn {

            width: 100%;

            padding: 13px 20px;

            font-family: 'Poppins', sans-serif;

            font-size: 0.95rem;

            font-weight: 600;

            background-color: gold;

            color: #0d1b2a;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            margin-top: 5px;

            transition: 0.3s ease;
        }

        .btn:hover {

            background-color: white;

            transform: translateY(-2px);
        }

        .back-link {

            display: block;

            margin-top: 20px;

            text-align: center;

            color: gold;

            text-decoration: none;

            font-size: 0.9rem;
        }

        .back-link:hover {

            text-decoration: underline;
        }

        @media (max-width: 600px) {

            body {
                padding: 20px 15px;
            }

            .form-container {
                padding: 25px 20px;
            }

            h2 {
                font-size: 1.4rem;
            }
        }

    </style>

</head>


<body>

    <div class="form-container">

        <h2>
            <i class="fas fa-mosque"></i>
            Tambah Khutbah Jumaat
        </h2>


        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}


            <!-- TARIKH -->

            <div class="form-group">

                <label for="date">
                    Tarikh
                </label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    required
                >

            </div>


            <!-- TAJUK -->

            <div class="form-group">

                <label for="khutbah_topic">
                    Tajuk Khutbah
                </label>

                <input
                    type="text"
                    id="khutbah_topic"
                    name="khutbah_topic"
                    placeholder="Masukkan tajuk khutbah"
                    maxlength="200"
                    required
                >

            </div>


            <!-- PDF -->

            <div class="form-group">

                <label for="pdf_file">
                    Fail PDF Khutbah
                </label>

                <div class="pdf-upload">

                    <i class="fas fa-file-pdf"></i>

                    <input
                        type="file"
                        id="pdf_file"
                        name="pdf_file"
                        accept=".pdf,application/pdf"
                        required
                    >

                    <span class="pdf-info">
                        Format yang dibenarkan: PDF sahaja
                    </span>

                </div>

            </div>


            <!-- KHATIB -->

            <div class="form-group">

                <label for="imam_id">
                    Khatib (Imam)
                </label>

                <select
                    id="imam_id"
                    name="imam_id"
                    required
                >

                    <option
                        value=""
                        disabled
                        selected
                    >
                        Pilih Imam
                    </option>

                    {% for imam in imams %}

                        <option value="{{ imam.imam_id }}">
                            {{ imam.name }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="btn"
            >

                <i class="fas fa-save"></i>
                Simpan Khutbah

            </button>

        </form>


        <a
            href="{% url 'khutbah_list' %}"
            class="back-link"
        >

            <i class="fas fa-arrow-left"></i>
            Kembali ke Senarai Khutbah

        </a>

    </div>


    <script>

        const pdfInput =
            document.getElementById('pdf_file');

        pdfInput.addEventListener(
            'change',
            function () {

                const file = this.files[0];

                if (file) {

                    if (
                        file.type !== 'application/pdf' &&
                        !file.name.toLowerCase().endsWith('.pdf')
                    ) {

                        alert(
                            'Sila pilih fail PDF sahaja.'
                        );

                        this.value = '';
                    }

                }

            }
        );

    </script>

</body>

</html>
